<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4 p-sm-5">
      
      <!-- Title -->
      <div class="text-center mb-4">
        <i class="bi bi-bus-front-fill text-primary display-4 mb-2"></i>
        <h3 class="fw-bold">Smart Bus Login</h3>
        <p class="text-muted small">Sign in to book and manage your trips</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      </div>

      <!-- Form -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" [(ngModel)]="credentials.email" required #email="ngModel" placeholder="name@example.com">
          </div>
          <div *ngIf="email.invalid && email.touched" class="text-danger small mt-1">Please enter a valid email.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" [(ngModel)]="credentials.password" required #pass="ngModel" placeholder="••••••••">
          </div>
          <div *ngIf="pass.invalid && pass.touched" class="text-danger small mt-1">Password is required.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" [disabled]="loginForm.invalid">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>

      <div class="mt-4 text-center">
        <small class="text-muted">Don't have an account? <a routerLink="/register" class="text-primary text-decoration-none fw-semibold">Register here</a></small>
      </div>

    </div>
  </div>
</div>
